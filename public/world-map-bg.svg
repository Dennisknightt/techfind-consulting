<svg viewBox="0 0 1440 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      @keyframes pulse-glow {
        0%, 100% { r: 8px; opacity: 0.8; }
        50% { r: 14px; opacity: 0.3; }
      }
      @keyframes pulse-core {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 7px; opacity: 0.6; }
      }
      @keyframes dash-animation {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      .dot-glow { animation: pulse-glow 3s ease-in-out infinite; }
      .dot-core { animation: pulse-core 2.5s ease-in-out infinite; }
      .connection-line {
        animation: dash-animation 8s linear infinite;
        stroke-dasharray: 5,5;
      }
    </style>
    <filter id="glow-map">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="node-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="800" fill="#0a4a6b"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <!-- Latitude lines -->
    <line x1="0" y1="133" x2="1440" y2="133"/>
    <line x1="0" y1="267" x2="1440" y2="267"/>
    <line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="0" y1="533" x2="1440" y2="533"/>
    <line x1="0" y1="667" x2="1440" y2="667"/>

    <!-- Longitude lines -->
    <line x1="180" y1="0" x2="180" y2="800"/>
    <line x1="360" y1="0" x2="360" y2="800"/>
    <line x1="540" y1="0" x2="540" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="1260" y1="0" x2="1260" y2="800"/>
  </g>

  <!-- Continents outline (simplified) -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none">
    <!-- North America -->
    <path d="M 150 200 L 200 180 L 220 220 L 200 280 L 150 250 Z"/>
    <!-- South America -->
    <path d="M 200 300 L 230 290 L 240 380 L 210 400 Z"/>
    <!-- Europe -->
    <path d="M 500 150 L 550 140 L 560 200 L 520 210 Z"/>
    <!-- Africa -->
    <path d="M 550 250 L 600 240 L 610 400 L 570 420 Z"/>
    <!-- Asia -->
    <path d="M 650 150 L 800 140 L 820 300 L 700 320 Z"/>
    <!-- Australia -->
    <path d="M 900 450 L 950 460 L 940 550 L 890 540 Z"/>
  </g>

  <!-- Connection lines - animated with gradient colors -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Connection lines with animation -->
  <g fill="none" stroke-width="2" filter="url(#glow-map)">
    <path d="M 200 250 Q 460 325 720 400" stroke="url(#grad1)" class="connection-line"/>
    <path d="M 150 500 Q 435 450 720 400" stroke="url(#grad2)" class="connection-line" style="animation-delay: 1s;"/>
    <path d="M 550 180 Q 635 290 720 400" stroke="url(#grad1)" class="connection-line" style="animation-delay: 2s;"/>
    <path d="M 900 120 Q 810 260 720 400" stroke="url(#grad3)" class="connection-line" style="animation-delay: 1.5s;"/>
    <path d="M 1100 300 Q 910 350 720 400" stroke="url(#grad2)" class="connection-line" style="animation-delay: 2.5s;"/>
    <path d="M 950 520 Q 835 460 720 400" stroke="url(#grad3)" class="connection-line" style="animation-delay: 0.5s;"/>
  </g>

  <!-- Peripheral nodes with animated glows -->
  <g filter="url(#node-glow)">
    <!-- Node 1 -->
    <circle cx="200" cy="250" class="dot-glow" fill="rgba(123, 58, 237, 0.5)"/>
    <circle cx="200" cy="250" class="dot-core" fill="#7C3AED"/>

    <!-- Node 2 -->
    <circle cx="150" cy="500" class="dot-glow" fill="rgba(59, 130, 246, 0.5)"/>
    <circle cx="150" cy="500" class="dot-core" fill="#3B82F6"/>

    <!-- Node 3 -->
    <circle cx="550" cy="180" class="dot-glow" fill="rgba(34, 211, 238, 0.5)"/>
    <circle cx="550" cy="180" class="dot-core" fill="#22D3EE"/>

    <!-- Node 4 -->
    <circle cx="900" cy="120" class="dot-glow" fill="rgba(123, 58, 237, 0.5)"/>
    <circle cx="900" cy="120" class="dot-core" fill="#7C3AED"/>

    <!-- Node 5 -->
    <circle cx="1100" cy="300" class="dot-glow" fill="rgba(59, 130, 246, 0.5)"/>
    <circle cx="1100" cy="300" class="dot-core" fill="#3B82F6"/>

    <!-- Node 6 -->
    <circle cx="950" cy="520" class="dot-glow" fill="rgba(34, 211, 238, 0.5)"/>
    <circle cx="950" cy="520" class="dot-core" fill="#22D3EE"/>
  </g>

  <!-- Central node with strong glow -->
  <g filter="url(#node-glow)">
    <circle cx="720" cy="400" r="16" fill="rgba(255,255,255,0.3)" style="animation: pulse-glow 2.5s ease-in-out infinite;"/>
    <circle cx="720" cy="400" r="10" fill="rgba(255,255,255,0.8)" style="animation: pulse-core 2s ease-in-out infinite;"/>
  </g>
</svg>
