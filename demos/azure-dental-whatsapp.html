<title>Azure Dental Hospital WhatsApp</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif;
    background: #000;
    padding: 20px;
  }

  .phone-frame {
    width: 100%;
    max-width: 390px;
    height: 844px;
    margin: 0 auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }

  .notch {
    height: 28px;
    background: #000;
    border-radius: 0 0 28px 28px;
  }

  .status-bar {
    background: #fff;
    padding: 8px 20px 4px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .chat-header {
    background: #fff;
    padding: 8px 16px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header-info {
    flex: 1;
    min-width: 0;
  }

  .header-name {
    font-weight: 600;
    font-size: 15px;
    color: #000;
  }

  .header-status {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }

  .header-icons {
    display: flex;
    gap: 16px;
    font-size: 20px;
  }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .chat-container::-webkit-scrollbar {
    width: 8px;
  }

  .chat-container::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 4px;
  }

  .message-group {
    display: flex;
    margin-bottom: 8px;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message-group.received {
    justify-content: flex-start;
  }

  .message-group.sent {
    justify-content: flex-end;
  }

  .bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    display: inline-block;
  }

  .message-group.received .bubble {
    background: #e5e5ea;
    color: #000;
  }

  .message-group.sent .bubble {
    background: #e7ffdb;
    color: #000;
  }

  .bubble-container {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .bubble-time {
    font-size: 12px;
    color: #999;
    padding: 0 4px;
  }

  .message-group.sent .bubble-time {
    text-align: right;
  }

  .bubble-with-tick {
    display: flex;
    align-items: flex-end;
    gap: 4px;
  }

  .tick-icon {
    font-size: 13px;
    color: #31a24c;
    flex-shrink: 0;
  }

  .buttons {
    max-width: 85%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    padding: 10px 20px;
    border: 2px solid #25d366;
    border-radius: 24px;
    background: transparent;
    color: #25d366;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:active {
    background: #f0fdf4;
  }

  .input-area {
    padding: 12px 16px 20px;
    display: flex;
    gap: 12px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
  }

  .input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f0f0f0;
    border-radius: 24px;
    padding: 8px 16px;
  }

  .input-field {
    flex: 1;
    border: none;
    background: none;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }

  .input-field::placeholder {
    color: #999;
  }

  .attachment-btn {
    background: none;
    border: none;
    color: #25d366;
    font-size: 20px;
    cursor: pointer;
    padding: 0;
  }

  .send-btn {
    background: none;
    border: none;
    color: #25d366;
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
  }

  .summary-card {
    max-width: 85%;
    background: #f9f9f9;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
  }

  .summary-title {
    font-weight: 600;
    color: #000;
    margin-bottom: 8px;
    font-size: 14px;
  }

  .summary-item {
    color: #555;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e5e5e5;
    line-height: 1.4;
  }

  .summary-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .summary-label {
    font-weight: 600;
    color: #000;
    font-size: 12px;
  }

  .summary-value {
    color: #555;
    font-size: 13px;
    margin-top: 2px;
  }
</style>

<div class="phone-frame">
  <div class="notch"></div>

  <div class="status-bar">
    <span>9:41</span>
    <span style="font-size: 11px;">● ● ● ● ●</span>
  </div>

  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">🦷</div>
      <div class="header-info">
        <div class="header-name">Azure Dental Hospital</div>
        <div class="header-status">Online</div>
      </div>
    </div>
    <div class="header-icons">
      <span>🔍</span>
      <span>⋮</span>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message-group received">
      <div class="bubble-container">
        <div class="bubble">Welcome to Azure Dental Hospital! 🦷</div>
        <div class="bubble-time">9:32 AM</div>
      </div>
    </div>

    <div class="message-group received">
      <div class="bubble-container">
        <div class="bubble">We're here to help you schedule an appointment with our specialist team.</div>
        <div class="bubble-time">9:33 AM</div>
      </div>
    </div>

    <div class="message-group received">
      <div class="bubble-container">
        <div class="bubble">What service are you interested in?</div>
        <div class="bubble-time">9:33 AM</div>
      </div>
    </div>

    <div class="message-group received" style="margin-top: 8px;">
      <div class="buttons">
        <button class="btn" onclick="selectService('General Dentistry')">General Dentistry</button>
        <button class="btn" onclick="selectService('Orthodontics')">Orthodontics</button>
        <button class="btn" onclick="selectService('Oral Surgery')">Oral Surgery</button>
        <button class="btn" onclick="selectService('Endodontics')">Endodontics</button>
        <button class="btn" onclick="selectService('Periodontics')">Periodontics</button>
        <button class="btn" onclick="selectService('Restorative & Cosmetic')">Restorative & Cosmetic</button>
        <button class="btn" onclick="selectService('Pediatric Dentistry')">Pediatric Dentistry</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <button class="attachment-btn">+</button>
      <input type="text" class="input-field" id="inputField" placeholder="Message" readonly>
    </div>
    <button class="send-btn" onclick="sendMessage()">🔊</button>
  </div>
</div>

<script>
  let currentStep = 'service';
  let selectedData = {};

  const stepsConfig = {
    service: {
      prompt: "What service are you interested in?",
      options: [
        'General Dentistry',
        'Orthodontics',
        'Oral Surgery',
        'Endodontics',
        'Periodontics',
        'Restorative & Cosmetic',
        'Pediatric Dentistry'
      ]
    },
    date: {
      prompt: "What date would work best for you? (e.g., Tomorrow, Next Monday, 15th Sep)"
    },
    time: {
      prompt: "What time? (e.g., Morning, 2:00 PM, 4:30 PM)"
    },
    name: {
      prompt: "What's your name?"
    },
    phone: {
      prompt: "What's your phone number?"
    }
  };

  function getTime() {
    const now = new Date();
    let hours = now.getHours();
    const mins = now.getMinutes();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    const minutesStr = mins < 10 ? '0' + mins : mins;
    return `${hours}:${minutesStr} ${ampm}`;
  }

  function selectService(service) {
    selectedData.service = service;
    addUserMessage(service);
    addBotMessage(`Great! You've selected ${service}.`);
    setTimeout(() => {
      addBotMessage(`Let me help you book an appointment.`);
      setTimeout(() => {
        currentStep = 'date';
        addBotMessage(stepsConfig.date.prompt);
      }, 400);
    }, 400);
  }

  function addUserMessage(text) {
    const chatContainer = document.getElementById('chatContainer');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message-group sent';
    messageDiv.innerHTML = `
      <div class="bubble-container">
        <div class="bubble-with-tick">
          <div class="bubble">${text}</div>
          <div class="tick-icon">✓✓</div>
        </div>
        <div class="bubble-time">${getTime()}</div>
      </div>
    `;
    chatContainer.appendChild(messageDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function addBotMessage(text, isCard = false) {
    const chatContainer = document.getElementById('chatContainer');
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message-group received';

    if (isCard) {
      messageDiv.innerHTML = `
        <div class="bubble-container">
          <div class="summary-card">
            <div class="summary-title">📋 Appointment Summary</div>
            <div class="summary-item">
              <div class="summary-label">Service</div>
              <div class="summary-value">${selectedData.service}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Preferred Date</div>
              <div class="summary-value">${selectedData.date}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Preferred Time</div>
              <div class="summary-value">${selectedData.time}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Name</div>
              <div class="summary-value">${selectedData.name}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Phone</div>
              <div class="summary-value">${selectedData.phone}</div>
            </div>
            <div class="summary-item">
              <div class="summary-label">Status</div>
              <div class="summary-value">✓ Awaiting confirmation</div>
            </div>
          </div>
          <div class="bubble-time">${getTime()}</div>
        </div>
      `;
    } else {
      messageDiv.innerHTML = `
        <div class="bubble-container">
          <div class="bubble">${text}</div>
          <div class="bubble-time">${getTime()}</div>
        </div>
      `;
    }

    chatContainer.appendChild(messageDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function handleInput(input) {
    addUserMessage(input);

    if (currentStep === 'date') {
      selectedData.date = input;
      addBotMessage("Perfect! And what time works best for you?");
      currentStep = 'time';
    } else if (currentStep === 'time') {
      selectedData.time = input;
      addBotMessage("Thank you! What's your full name?");
      currentStep = 'name';
    } else if (currentStep === 'name') {
      selectedData.name = input;
      addBotMessage("What's your phone number so we can confirm?");
      currentStep = 'phone';
    } else if (currentStep === 'phone') {
      selectedData.phone = input;
      addBotMessage("Processing your appointment request...");
      setTimeout(() => {
        addBotMessage("Appointment Summary", true);
        setTimeout(() => {
          addBotMessage("We'll confirm your appointment shortly. Our team will call you within 2 hours. Thank you for choosing Azure Dental Hospital!");
          document.getElementById('inputField').disabled = true;
        }, 500);
      }, 500);
      currentStep = 'complete';
    }
  }

  function sendMessage() {
    const input = document.getElementById('inputField');
    if (input.value.trim() && currentStep !== 'service' && currentStep !== 'complete') {
      handleInput(input.value.trim());
      input.value = '';
    }
  }

  document.getElementById('inputField').addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && currentStep !== 'service' && currentStep !== 'complete') {
      sendMessage();
    }
  });
</script>
