<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Over Ridge Woodproducts WhatsApp Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* WhatsApp's default look, deliberately fixed: the demo shows the client the
     standard chat theme, not whatever light/dark mode their phone happens to be in. */
  :root{
    color-scheme:light;
    --stage-bg-1:#f6efe6;
    --stage-bg-2:#e8dccd;
    --stage-ink:#5c3a21;
    --stage-ink-soft:#9b8571;
    --frame:#d8c8b4;

    --chrome:#f0f2f5;
    --chrome-ink:#111b21;
    --chrome-ink-soft:#667781;
    --chat-bg:#e5ddd5;
    --bubble-in:#ffffff;
    --bubble-in-ink:#111b21;
    --bubble-out:#d9fdd3;
    --bubble-out-ink:#111b21;
    --meta:#667781;
    --tick:#8696a0;
    --tick-read:#53bdeb;
    --reply-card:#ffffff;
    --reply-ink:#0091ea;
    --reply-line:rgba(17,27,33,.10);
    --composer:#ffffff;
    --composer-bg:#f0f2f5;
    --send:#00a884;
    --divider:rgba(17,27,33,.10);
    --sun:#a9713f;
    --brand:#5c3a21;
    --card:#ffffff;
    --card-ink:#111b21;
    --shadow:0 1px .5px rgba(11,20,26,.13);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--stage-bg-2);
    color:var(--stage-ink);
    font-family:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--stage-bg-1) 0%, var(--stage-bg-2) 70%);
  }

  .phone{
    position:relative;
    width:min(100%, 412px);
    height:min(100%, 880px);
    display:flex; flex-direction:column;
    background:var(--chat-bg);
    border-radius:30px;
    overflow:hidden;
    border:1px solid var(--frame);
    box-shadow:0 30px 60px -24px rgba(28,20,8,.45), 0 2px 6px rgba(28,20,8,.10);
  }

  /* ---------- header ---------- */
  .bar{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    background:var(--chrome);
    color:var(--chrome-ink);
    border-bottom:1px solid var(--divider);
    flex:0 0 auto;
    z-index:3;
  }
  .back{display:flex; color:var(--chrome-ink-soft);}
  .avatar{
    width:41px; height:41px; border-radius:50%; flex:0 0 auto;
    background:#fff; overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .who{display:flex; flex-direction:column; min-width:0; flex:1; overflow:hidden;}
  .who b{font-size:16px; font-weight:600; letter-spacing:-.015em; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .who span{font-size:12.5px; color:var(--chrome-ink-soft); line-height:1.4; height:18px;}
  .who span.typing{color:var(--send); font-weight:500;}
  .bar-actions{display:flex; align-items:center; gap:0;}
  .icon-btn{
    appearance:none; border:0; background:transparent; cursor:pointer;
    width:34px; height:34px; border-radius:50%;
    display:grid; place-items:center; color:var(--chrome-ink-soft);
    transition:background .15s ease, color .15s ease, transform .3s ease;
  }
  .icon-btn:hover{background:rgba(128,128,128,.14); color:var(--chrome-ink);}
  .icon-btn:focus-visible{outline:2px solid var(--send); outline-offset:2px;}
  .icon-btn.spin{transform:rotate(-360deg);}
  .icon-btn.ghost{pointer-events:none;}

  /* ---------- chat ---------- */
  .chat{
    flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
    padding:14px 10px 8px;
    display:flex; flex-direction:column; gap:3px;
    background-color:var(--chat-bg);
    background-image:var(--doodle-img);
    background-size:315px;
    scrollbar-width:thin;
  }
  .day{
    align-self:center; margin:2px 0 10px;
    font-size:11.5px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--meta); background:var(--card);
    padding:5px 12px; border-radius:8px; box-shadow:var(--shadow);
  }
  .row{display:flex; width:100%;}
  .row.out{justify-content:flex-end;}
  .msg{
    position:relative;
    max-width:82%;
    padding:6px 9px 8px 10px;
    border-radius:8px;
    font-size:14.6px; line-height:1.38;
    white-space:pre-wrap; word-wrap:break-word;
    box-shadow:var(--shadow);
    animation:pop .18s ease-out both;
  }
  @keyframes pop{from{opacity:0; transform:translateY(7px) scale(.99);} to{opacity:1; transform:none;}}
  .row.in .msg{background:var(--bubble-in); color:var(--bubble-in-ink); border-top-left-radius:2px;}
  .row.out .msg{background:var(--bubble-out); color:var(--bubble-out-ink); border-top-right-radius:2px;}
  .row + .row{margin-top:3px;}
  .row.in + .row.out, .row.out + .row.in{margin-top:9px;}
  .meta{
    float:right; margin:8px -2px -4px 8px;
    font-size:11px; color:var(--meta);
    display:flex; align-items:center; gap:3px; line-height:1;
  }
  .tick{width:15px; height:15px; color:var(--tick); transition:color .2s ease;}
  .tick.read{color:var(--tick-read);}

  .typingBubble{display:flex; gap:4px; align-items:center; padding:11px 13px;}
  .typingBubble i{
    width:7px; height:7px; border-radius:50%; background:var(--meta); display:block;
    animation:blink 1.25s infinite ease-in-out;
  }
  .typingBubble i:nth-child(2){animation-delay:.18s;}
  .typingBubble i:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.32; transform:translateY(0);} 30%{opacity:1; transform:translateY(-2px);}}

  /* ---------- quick replies ---------- */
  .replies{
    display:flex; flex-wrap:wrap; gap:6px;
    margin:7px 0 4px; padding:0 2px;
    animation:pop .2s ease-out both;
  }
  .replies.stack{flex-direction:column;}
  .reply{
    appearance:none; cursor:pointer;
    font:inherit; font-size:14.2px; font-weight:500;
    color:var(--reply-ink); background:var(--reply-card);
    border:1px solid var(--reply-line); border-radius:18px;
    padding:9px 15px; box-shadow:var(--shadow);
    transition:transform .12s ease, filter .12s ease;
    display:inline-flex; align-items:center; gap:7px;
  }
  .replies.stack .reply{justify-content:center; width:100%;}
  .reply:hover{filter:brightness(1.03); transform:translateY(-1px);}
  .reply:active{transform:translateY(0) scale(.985);}
  .reply:focus-visible{outline:2px solid var(--send); outline-offset:2px;}
  .reply.picked{background:var(--send); color:#fff; border-color:transparent;}
  .reply .box{
    width:16px; height:16px; border-radius:5px; flex:0 0 auto;
    border:1.6px solid currentColor; opacity:.55;
    display:grid; place-items:center;
  }
  .reply.picked .box{opacity:1; background:#fff; color:var(--send); border-color:#fff;}
  .reply .box svg{opacity:0;}
  .reply.picked .box svg{opacity:1;}
  .reply.go{
    background:var(--send); color:#fff; border-color:transparent; font-weight:600;
    align-self:flex-end; padding:9px 20px;
  }
  .reply.go[disabled]{opacity:.45; cursor:not-allowed; transform:none;}

  /* ---------- receipt card ---------- */
  .receipt{
    align-self:center; width:min(100%, 320px);
    margin:12px 0 6px; padding:16px 16px 14px;
    background:var(--card); color:var(--card-ink);
    border-radius:14px; box-shadow:var(--shadow), 0 8px 24px -16px rgba(0,0,0,.5);
    border-top:3px solid var(--sun);
    animation:pop .25s ease-out both;
  }
  .receipt h3{margin:0 0 2px; font-size:15.5px; font-weight:600; letter-spacing:-.01em;}
  .receipt p{margin:0 0 10px; font-size:12.5px; color:var(--meta);}
  .receipt dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:12.8px;}
  .receipt dt{color:var(--meta);}
  .receipt dd{margin:0; text-align:right; font-weight:500; overflow-wrap:anywhere;}

  /* ---------- composer ---------- */
  .composer{
    flex:0 0 auto; display:flex; align-items:flex-end; gap:8px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--composer-bg);
    border-top:1px solid var(--divider);
  }
  .field{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--composer); border-radius:22px; padding:9px 14px;
    color:var(--chrome-ink); box-shadow:var(--shadow);
  }
  .field input{
    flex:1; border:0; background:transparent; outline:none;
    font:inherit; font-size:15px; color:var(--chrome-ink); min-width:0;
  }
  .field input::placeholder{color:var(--chrome-ink-soft);}
  .field .tool{flex:0 0 auto; color:var(--chrome-ink-soft); opacity:.75;}
  /* WhatsApp shows a mic until there is something to send; so does the demo. */
  .composer.locked .sendBtn .icon-send{display:none;}
  .composer:not(.locked) .sendBtn .icon-mic{display:none;}
  .sendBtn{
    width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
    background:var(--send); color:#fff; display:grid; place-items:center; flex:0 0 auto;
    transition:transform .12s ease, opacity .12s ease;
  }
  .sendBtn:active{transform:scale(.94);}
  .sendBtn[disabled]{cursor:default;}
  .sendBtn:focus-visible{outline:2px solid var(--chrome-ink); outline-offset:2px;}

  .caption{
    font-size:12.5px; color:var(--stage-ink-soft); letter-spacing:.02em;
    display:flex; align-items:center; gap:8px; text-align:center;
  }
  .caption b{font-weight:600; color:var(--stage-ink);}

  @media (max-width:520px){
    .stage{padding:0; gap:0;}
    .phone{width:100%; height:100%; border-radius:0; border:0; box-shadow:none;}
    .caption{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }
</style>

    phone: ["M-8.4-7.6a2.6 2.6 0 0 1 3.8-.6l2 2.4-2.4 3c1.6 2.6 3.6 4.6 6.2 6.2l3-2.4 2.4 2a2.6 2.6 0 0 1-.6 3.8C1 9.6-8.4-.2-8.4-7.6z"],
    pin: ["M0 10s7-7.6 7-12A7 7 0 1 0-7-2c0 4.4 7 12 7 12z", ring(0, -2, 2.6)],
    ball: [ring(0, 0, 9), "M0-9 3.6-4 0 0-3.6-4z", "M0 0 3.6-4 8.2-2.2", "M0 0-3.6-4-8.2-2.2", "M0 0v6.4"],
    bubble: ["M-9-8h18v11.6h-10.6l-5 4v-4h-2.4z"]
  };

  /* Jittered placements, so the tile reads as scattered rather than gridded. */
  const SPOTS = [
    ["heart", 34, 30, -12, .9], ["camera", 118, 22, 8, .82], ["cup", 205, 38, -6, .86],
    ["music", 272, 26, 14, .9], ["plane", 62, 96, -18, .88], ["smiley", 152, 88, 0, .8],
    ["clock", 236, 104, 6, .82], ["bolt", 296, 92, -8, .9], ["book", 26, 152, 10, .84],
    ["gift", 100, 166, -9, .8], ["balloon", 178, 158, 12, .86], ["bicycle", 258, 172, 0, .78],
    ["sun", 46, 224, 0, .9], ["envelope", 124, 236, -7, .82], ["umbrella", 200, 228, 9, .84],
    ["pin", 282, 242, -4, .86], ["cloud", 14, 288, 6, .86], ["bell", 88, 292, -10, .82],
    ["key", 166, 296, 14, .84], ["ball", 244, 292, 0, .8], ["bubble", 300, 200, -6, .8],
    ["phone", 6, 76, 8, .84]
  ];

  const doodle = (ink, alpha) => `<svg xmlns="http://www.w3.org/2000/svg" width="315" height="315" viewBox="0 0 315 315">
    <g fill="none" stroke="${ink}" stroke-opacity="${alpha}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      ${SPOTS.map(([name, x, y, rot, sc]) =>
        `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">` +
        ICONS[name].map(d => `<path d="${d}"/>`).join("") + `</g>`).join("")}
    </g></svg>`;

  const paper = (ink, alpha) => `url("data:image/svg+xml,${encodeURIComponent(doodle(ink, alpha))}")`;
  document.documentElement.style.setProperty("--doodle-img", paper("rgb(84,66,45)", 0.13));

  const chat = document.getElementById("chat");
  const presence = document.getElementById("presence");
  const composer = document.getElementById("composer");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const restartBtn = document.getElementById("restart");

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ABORT = Symbol("restart");
  let runId = 0;

  const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 120) : ms));
  const guard = id => { if (id !== runId) throw ABORT; };
  const clock = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const toBottom = () => { chat.scrollTop = chat.scrollHeight; };

  const TICK = `<svg class="tick" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.6l3 3 5.6-6.8"/></svg>`;
  const TICKS = `<svg class="tick" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.4 9.6l3 3 5.6-6.8"/><path d="M7.2 12.6l5.6-6.8"/></svg>`;
  const CHECK = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.5L20 6.5"/></svg>`;

  /* ---------------- primitives ---------------- */

  function dayStamp() {
    const el = document.createElement("div");
    el.className = "day";
    el.textContent = "Today";
    chat.append(el);
  }

  function bubble(side, text) {
    const row = document.createElement("div");
    row.className = `row ${side}`;
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.textContent = text;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.innerHTML = `<span>${clock()}</span>`;
    msg.append(meta);
    row.append(msg);
    chat.append(row);
    toBottom();
    return { row, msg, meta };
  }

  /* A sent message earns its ticks the way a real one does: sent, delivered, read. */
  async function sent(text, id) {
    const { meta } = bubble("out", text);
    const mark = document.createElement("span");
    mark.innerHTML = TICK;
    meta.append(mark);
    await wait(260); guard(id);
    mark.innerHTML = TICKS;
    await wait(420); guard(id);
    mark.firstElementChild.classList.add("read");
  }

  async function typing(ms, id) {
    presence.textContent = "typing…";
    presence.classList.add("typing");
    const row = document.createElement("div");
    row.className = "row in";
    row.innerHTML = `<div class="msg typingBubble"><i></i><i></i><i></i></div>`;
    chat.append(row);
    toBottom();
    try { await wait(ms); guard(id); }
    finally {
      row.remove();
      presence.textContent = "online";
      presence.classList.remove("typing");
    }
  }

  /* Reading time scales with the message, so long replies feel written, not pasted. */
  const think = text => Math.min(1500, 480 + text.length * 11);

  async function says(text, id) {
    await wait(340); guard(id);
    await typing(think(text), id);
    bubble("in", text);
    await wait(160); guard(id);
  }

  function replyBlock(stack) {
    const box = document.createElement("div");
    box.className = "replies" + (stack ? " stack" : "");
    chat.append(box);
    toBottom();
    return box;
  }

  /* ---------------- asks ---------------- */

  async function askButtons(text, options, id) {
    await says(text, id);
    const stack = options.some(o => o.label.length > 22) || options.length <= 3;
    const box = replyBlock(stack);
    const choice = await new Promise(resolve => {
      options.forEach(opt => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "reply";
        b.textContent = opt.label;
        b.addEventListener("click", () => resolve(opt), { once: true });
        box.append(b);
      });
      toBottom();
    });
    guard(id);
    box.remove();
    await sent(choice.label, id);
    return choice;
  }

  async function askMulti(text, options, id) {
    await says(text, id);
    const box = replyBlock(false);
    const picked = new Set();
    const go = document.createElement("button");
    go.type = "button";
    go.className = "reply go";
    go.textContent = "Continue →";
    go.disabled = true;

    const chosen = await new Promise(resolve => {
      options.forEach(opt => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "reply";
        b.innerHTML = `<span class="box">${CHECK}</span><span></span>`;
        b.lastElementChild.textContent = opt.label;
        b.addEventListener("click", () => {
          if (picked.has(opt.label)) picked.delete(opt.label);
          else picked.add(opt.label);
          b.classList.toggle("picked", picked.has(opt.label));
          go.disabled = picked.size === 0;
        });
        box.append(b);
      });
      go.addEventListener("click", () => resolve([...picked]), { once: true });
      box.append(go);
      toBottom();
    });
    guard(id);
    box.remove();
    await sent(chosen.join(", "), id);
    return chosen;
  }

  async function askText(text, placeholder, id) {
    await says(text, id);
    input.readOnly = false;
    input.value = "";
    input.placeholder = placeholder;
    send.disabled = false;
    composer.classList.remove("locked");
    if (window.matchMedia("(min-width: 521px)").matches) input.focus();

    const answer = await new Promise(resolve => {
      composer.onsubmit = e => {
        e.preventDefault();
        const v = input.value.trim();
        if (v) { composer.onsubmit = null; resolve(v); }
      };
    });
    guard(id);
    lockComposer();
    await sent(answer, id);
    return answer;
  }

  function lockComposer() {
    composer.onsubmit = e => e.preventDefault();
    input.value = "";
    input.readOnly = true;
    input.placeholder = "Choose an option above";
    send.disabled = true;
    composer.classList.add("locked");
    input.blur();
  }

  function receipt(title, note, rows) {
    const el = document.createElement("div");
    el.className = "receipt";
    const dl = rows.map(([k, v]) =>
      `<dt>${k}</dt><dd>${String(v).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</dd>`).join("");
    el.innerHTML = `<h3>${title}</h3><p>${note}</p><dl>${dl}</dl>`;
    chat.append(el);
    toBottom();
  }

  /* ---------------- the conversation ---------------- */

  const opt = (label, value) => ({ label, value: value ?? label });

  async function conversation(id) {
    dayStamp();
    const brief = [];
    const note = (k, v) => brief.push([k, v]);

    /* Opens on the message their "Start a project" link already writes for the customer. */
    await sent("Hello Over Ridge, I would like to discuss a woodwork project.", id);
    await wait(420); guard(id);

    const what = await askButtons(
      "Hello \u{1F44B} Welcome to Over Ridge Woodproducts.\nTimeless woodwork, crafted in Kenya.\n\nWhat's the project?",
      [opt("\u{1F6AA} Doors", "doors"), opt("\u{1FA9C} Staircase", "stairs"),
       opt("\u{1FAB5} Wooden flooring", "floor"), opt("\u{1F3E0} Ceilings & cladding", "ceiling"),
       opt("\u{1FA91} Bespoke joinery", "joinery"), opt("\u2753 Not sure yet", "unsure")],
      id);
    note("Project", what.label.replace(/^[^\p{L}]+/u, ""));

    if (what.value === "doors") {
      const style = await askButtons("Which kind of doors are you after?", [
        opt("Solid hardwood"), opt("Flush"), opt("French"),
        opt("Custom design"), opt("Advise me")], id);
      note("Door type", style.label);

      const qty = await askButtons("Roughly how many?",
        [opt("Just one"), opt("2\u20134"), opt("5\u201310"), opt("More than 10")], id);
      note("Quantity", qty.label);

    } else if (what.value === "stairs") {
      const scope = await askButtons("What does the staircase need?", [
        opt("A full build"), opt("Treads only"),
        opt("Handrails & balustrades"), opt("Refinish an existing one")], id);
      note("Scope", scope.label);

    } else if (what.value === "floor") {
      const kind = await askButtons("Which flooring are you considering?", [
        opt("Woodblocks"), opt("Parquet"), opt("Herringbone"),
        opt("SPC"), opt("Advise me")], id);
      note("Flooring", kind.label);

      const area = await askButtons("Roughly what area?",
        [opt("Under 20 sqm"), opt("20\u201350 sqm"), opt("50\u2013100 sqm"),
         opt("Over 100 sqm"), opt("Not measured yet")], id);
      note("Area", area.label);

    } else if (what.value === "ceiling") {
      const kind = await askButtons("Which are you looking at?", [
        opt("T&G boards"), opt("Exposed beams"),
        opt("Wall cladding"), opt("Finishes only")], id);
      note("Type", kind.label);

    } else if (what.value === "joinery") {
      const piece = await askText("Tell us what you have in mind.", "e.g. fitted wardrobes and a kitchen island", id);
      note("Brief", piece);

    } else {
      await says("No problem \u2014 that's what the consultation is for. We'll go through materials and options with you.", id);
      await wait(280); guard(id);
    }

    const stage = await askButtons("Where is the project at right now?", [
      opt("\u{1F3D7}\uFE0F Under construction"), opt("\u{1F528} Renovating"),
      opt("\u{1F4D0} Drawings ready"), opt("\u{1F4A1} Still planning")], id);
    note("Stage", stage.label.slice(2).trim());

    const when = await askButtons("When would you like it done?", [
      opt("Within a month"), opt("1\u20133 months"),
      opt("More than 3 months"), opt("Flexible")], id);
    note("Timeline", when.label);

    const where = await askText("And where is the site?", "e.g. Runda, Nairobi", id);
    note("Site", where);

    await close(id, brief,
      "Thank you \u{1F44D} That gives our team what they need to price it properly.\n\nWhat would suit you next?",
      [opt("\u{1F4CB} Request a quotation", "quote"),
       opt("\u{1F3EC} Visit the Ruaka showroom", "showroom"),
       opt("\u{1F4CF} Book a site measurement", "measure")]);
  }

  const ENDINGS = {
    quote: { ask: "Certainly \u{1F44D} What name should we use?", title: "\u{1F4CB} Quotation Requested",
             note: "Sent to the Over Ridge workshop", label: "Quotation" },
    showroom: { ask: "Certainly \u{1F44D} What name should we use for the visit?", title: "\u{1F3EC} Showroom Visit",
                note: "Sent to the Over Ridge workshop", label: "Showroom visit" },
    measure: { ask: "Certainly \u{1F44D} What name should we use?", title: "\u{1F4CF} Site Measurement Requested",
               note: "Sent to the Over Ridge workshop", label: "Site measurement" }
  };

  async function close(id, brief, prompt, options) {
    const next = await askButtons(prompt, options, id);
    const end = ENDINGS[next.value];

    const name = await askText(end.ask, "Your name", id);
    const phone = await askText("And what's the best phone number to reach you?", "07xx xxx xxx", id);

    await says(`✅ Thank you, ${name}.\n\nYour project details have been captured.\n\nOur team would now come back to you on materials, timelines and a quotation.`, id);
    await wait(220); guard(id);

    receipt(end.title, end.note,
      [...brief, ["Request", end.label], ["Name", name], ["Phone", phone]]);
    toBottom();
  }

  /* ---------------- lifecycle ---------------- */

  async function start() {
    const id = ++runId;
    chat.innerHTML = "";
    lockComposer();
    try { await conversation(id); }
    catch (e) { if (e !== ABORT) throw e; }
  }

  restartBtn.addEventListener("click", () => {
    restartBtn.classList.add("spin");
    setTimeout(() => restartBtn.classList.remove("spin"), 320);
    start();
  });

  start();
})();
</script>
</html>
